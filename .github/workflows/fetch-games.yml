name: Fetch Games Daily Data

on:
  schedule:
    # Runs every 2 days at 00:15 UTC (e.g. 1st, 3rd, 5th, etc.)
    - cron: '15 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Fetch and update game assets
        run: bun run fetch-games

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No new game data found."
          else
            git commit -m "chore(assets): update static game assets [skip ci]"
            git push
          fi
